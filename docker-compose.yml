version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taskadmin
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskadmin -d taskdashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
